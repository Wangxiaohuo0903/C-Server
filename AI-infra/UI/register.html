<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - AI Chat</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI Chat</h1>
            <p>创建新账户开始使用</p>
        </div>

        <div class="form-container">
            <div id="error" class="error"></div>
            <div id="success" class="success"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        autocomplete="username"
                        placeholder="请输入用户名"
                        minlength="3"
                    >
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="new-password"
                        placeholder="请输入密码"
                        minlength="6"
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        required
                        autocomplete="new-password"
                        placeholder="请再次输入密码"
                        minlength="6"
                    >
                </div>

                <button type="submit" class="btn" id="submitBtn">注册</button>
            </form>

            <div class="link-container">
                已有账户？<a href="/login.html">立即登录</a>
            </div>
        </div>
    </div>

    <script src="/simple-api.js"></script>
    <script>
        const form = document.getElementById('registerForm');
        const errorDiv = document.getElementById('error');
        const successDiv = document.getElementById('success');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Hide messages
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');
            errorDiv.textContent = '';
            successDiv.textContent = '';

            // Validate passwords match
            if (password !== confirmPassword) {
                errorDiv.textContent = '两次输入的密码不一致';
                errorDiv.classList.add('show');
                return;
            }

            // Validate password length
            if (password.length < 6) {
                errorDiv.textContent = '密码长度至少为6位';
                errorDiv.classList.add('show');
                return;
            }

            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = '注册中...';

            try {
                await API.register(username, password);

                successDiv.textContent = '注册成功！3秒后跳转到登录页面...';
                successDiv.classList.add('show');

                // Redirect to login page after 3 seconds
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 3000);
            } catch (error) {
                errorDiv.textContent = error.message || '注册失败，用户名可能已存在';
                errorDiv.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = '注册';
            }
        });

        // Auto-focus username field
        document.getElementById('username').focus();
    </script>
</body>
</html>
