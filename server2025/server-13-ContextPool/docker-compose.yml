version: '3.8'

services:
  server12:
    build:
      context: .
      dockerfile: Dockerfile
    image: server12:latest
    container_name: server12_multichat
    ports:
      - "6060:8080"  # 本地6060端口 → Docker内8080端口
    volumes:
      # 挂载模型文件（从AI-infra）
      - ../../AI-infra/models:/app/models:ro
    environment:
      - MODEL_PATH=/app/models/DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf  # DeepSeek-R1 1.5B (推理能力强)
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/sessions"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
