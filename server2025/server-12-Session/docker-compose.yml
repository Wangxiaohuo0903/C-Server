version: '3.8'

services:
  server12:
    build: .
    container_name: server12-chat
    ports:
      - "8081:8080"  # 使用8081避免与现有容器冲突
    volumes:
      # 挂载models目录（如果本地有模型）
      - ./models:/app/models:ro
      # 挂载数据库（持久化）
      - ./data:/app/data
    environment:
      - MODEL_PATH=/app/models/tinyllama-q4.gguf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/echo", "-H", "Content-Type: application/json", "-d", "{\"test\":\"health\"}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
