version: '3.8'

services:
  server11-real-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server11-real-ai
    ports:
      - "8080:8080"
    volumes:
      # 可选：挂载本地模型目录（如果不想在Docker镜像中下载）
      # - ./models:/app/models
      # 可选：持久化数据库
      - ./users.db:/app/users.db
    environment:
      - MODEL_PATH=/app/models/tinyllama-q4.gguf
    restart: unless-stopped
    # 资源限制（可根据实际情况调整）
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
